<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vaal Radiology - Intranet Login</title>
  <style>
    /* Reset & Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #1a202c;
    }

    /* Header & Branding */
    .brand-container {
      text-align: center;
      margin-bottom: 24px;
    }

    .logo {
      max-width: 180px;
      height: auto;
      margin-bottom: 12px;
    }

    .brand-container h1 {
      font-size: 24px;
      font-weight: 700;
      color: #2d3748;
      margin-bottom: 4px;
    }

    .brand-container p {
      font-size: 14px;
      color: #718096;
    }

    /* Login Card */
    .login-card {
      background: #ffffff;
      padding: 36px 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 420px;
      border: 1px solid #e2e8f0;
    }

    .login-card h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 24px;
      color: #2d3748;
      text-align: left;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #4a5568;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper input {
      width: 100%;
      padding: 12px 40px 12px 40px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      font-size: 14px;
      color: #2d3748;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    /* Adjust padding for email input since it doesn't have a right-side toggle */
    .input-wrapper input.email-input {
      padding-right: 12px;
    }

    .input-wrapper input:focus {
      border-color: #3182ce;
      box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
    }

    .input-icon {
      position: absolute;
      left: 12px;
      color: #a0aec0;
      font-size: 16px;
    }

    /* Password Toggle Button Styling */
    .password-toggle {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      cursor: pointer;
      color: #a0aec0;
      font-size: 16px;
      display: flex;
      align-items: center;
      padding: 0;
    }

    .password-toggle:hover {
      color: #4a5568;
    }

    /* Form Options (Remember Me & Forgot Password) */
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      margin-bottom: 24px;
      color: #4a5568;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .remember-me input {
      accent-color: #3182ce;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .forgot-link {
      color: #3182ce;
      text-decoration: none;
      font-weight: 500;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    /* Submit Button */
    .login-btn {
      width: 100%;
      padding: 12px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .login-btn:hover {
      background-color: #1d4ed8;
    }

    /* Footer */
    .footer-text {
      margin-top: 24px;
      font-size: 13px;
      color: #718096;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Brand & Header -->
  <div class="brand-container">
    <img src="logo.png" alt="Vaal Radiology Logo" class="logo">
    <h1>Vaal Radiology</h1>
    <p>Authorized Staff Intranet Portal</p>
  </div>

  <!-- Login Card -->
  <div class="login-card">
    <h2>Log in to your account</h2>
    
    <form action="#" method="POST">
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <span class="input-icon">✉</span>
          <input type="email" id="email" class="email-input" placeholder="name@vaalradiology.co.za" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input type="password" id="password" placeholder="••••••••" required>
          <!-- Show/Hide Password Toggle Button -->
          <button type="button" id="togglePassword" class="password-toggle" aria-label="Toggle password visibility">
            👁️
          </button>
        </div>
      </div>

      <!-- Remember Me & Forgot Password Row -->
      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" id="remember"> Remember this device
        </label>
        <a href="#forgot-password" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="login-btn">Log In &rarr;</button>
    </form>
  </div>

  <!-- Footer -->
  <div class="footer-text">
    &copy; Vaal Radiology. Intranet access only.
  </div>

  <!-- JavaScript for Password Toggle Functionality -->
  <script>
    const passwordInput = document.getElementById('password');
    const togglePasswordBtn = document.getElementById('togglePassword');

    togglePasswordBtn.addEventListener('click', function () {
      // Toggle the type attribute between password and text
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      
      // Toggle icon feedback (can adjust emoji or swap with SVG icons if preferred)
      this.textContent = type === 'password' ? '👁️' : '👁️‍🗨️';
    });
  </script>

</body>
</html>
